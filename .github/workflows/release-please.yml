name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          release-type: simple
          tag-prefix: v
          target-branch: master
          pull-request-title-pattern: 'chore(master): release ${version}'
          pull-request-header: ':package: ReTTR Release'
          changelog-sections: >
            [
              {"type": "feat", "section": "Features", "hidden": false},
              {"type": "fix", "section": "Bug Fixes", "hidden": false},
              {"type": "perf", "section": "Performance Improvements", "hidden": false},
              {"type": "refactor", "section": "Code Refactoring", "hidden": false},
              {"type": "revert", "section": "Reverts", "hidden": false},
              {"type": "docs", "section": "Documentation", "hidden": false},
              {"type": "test", "section": "Tests", "hidden": false},
              {"type": "build", "section": "Build System", "hidden": false},
              {"type": "ci", "section": "Continuous Integration", "hidden": false},
              {"type": "style", "section": "Code Style", "hidden": false}
            ]

  sync-version:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Update version files
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          VERSION=${VERSION#v}
          sed -i "s/^project(ReTTR VERSION [0-9.]*/project(ReTTR VERSION ${VERSION}/" CMakeLists.txt
          echo "${VERSION}" > version.txt

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt version.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync version to ${VERSION} [skip ci]"
            git push
          fi
